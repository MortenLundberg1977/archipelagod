<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Archipelagod 🏝️</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <!-- ── Login screen ───────────────────────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-box">
      <h1>🏝️ Archipelagod</h1>
      <p>Build your island. Grow your people. Trade with the world.</p>

      <div class="auth-tabs">
        <button id="tab-login"    class="tab-btn active">Return to island</button>
        <button id="tab-register" class="tab-btn">New island</button>
      </div>

      <div id="panel-login">
        <input id="login-name" type="text"     placeholder="Your name"   maxlength="20" autocomplete="username">
        <input id="login-pin"  type="password" placeholder="4-digit PIN" maxlength="4"
               pattern="\d{4}" inputmode="numeric" autocomplete="current-password">
        <button id="login-btn">Set Sail ⛵</button>
        <div id="login-error" class="auth-error hidden"></div>
      </div>

      <div id="panel-register" class="hidden">
        <input id="reg-name"  type="text"     placeholder="Choose a name" maxlength="20" autocomplete="username">
        <input id="reg-pin"   type="password" placeholder="Choose a 4-digit PIN" maxlength="4"
               pattern="\d{4}" inputmode="numeric" autocomplete="new-password">
        <input id="reg-pin2"  type="password" placeholder="Repeat PIN"    maxlength="4"
               pattern="\d{4}" inputmode="numeric" autocomplete="new-password">
        <button id="register-btn">Found Island 🏝️</button>
        <div id="reg-error" class="auth-error hidden"></div>
      </div>
    </div>
  </div>

  <!-- ── Recovery code modal ───────────────────────────────────────────── -->
  <div id="recovery-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>🗺️ Island Passport</h2>
      <p>Write this down or give it to your gamemaster.<br>You'll need it if you forget your PIN.</p>
      <div id="recovery-code-display" class="recovery-code"></div>
      <p class="recovery-name">Island: <strong id="recovery-island-name"></strong></p>
      <button id="recovery-ok-btn" onclick="dismissRecovery()">Got it! Start playing →</button>
    </div>
  </div>

  <!-- ── Game screen ────────────────────────────────────────────────────── -->
  <div id="game-screen" class="hidden">

    <!-- island-name / hud kept as hidden elements so game.js can still set them -->
    <span id="island-name"      style="display:none"></span>
    <span id="island-type-badge"style="display:none"></span>
    <div   id="hud"             style="display:none">
      <span id="hud-pop"   ><span class="hud-val">0</span></span>
      <span id="hud-happy" ><span class="hud-val">0%</span></span>
      <span id="hud-food"  ><span class="hud-val">0</span></span>
      <span id="hud-ore"   ><span class="hud-val">0</span></span>
      <span id="hud-timber"><span class="hud-val">0</span></span>
      <span id="hud-fish"  ><span class="hud-val">0</span></span>
    </div>

    <!-- ── Main game area: landscape split ── -->
    <div id="game-body">

      <!-- Left: map + builder bar -->
      <div id="map-col">
        <div id="map-container">
          <canvas id="island-map"></canvas>
        </div>

        <!-- Placement hint (shown when in placement mode) -->
        <div id="placement-hint" class="hidden"></div>

        <!-- Builder toolbar: icon grid below the map -->
        <div id="builder-bar">
          <!-- buttons injected by game.js -->
        </div>
      </div>

      <!-- Right sidebar: minimap + status + world -->
      <div id="sidebar">

        <!-- Minimap + quick stats -->
        <div id="sidebar-map-panel">
          <div id="sidebar-island-name"></div>
          <canvas id="mini-map" width="128" height="128" title="Island overview"></canvas>
          <div id="pop-status">
            <div class="stat-row" id="stat-pop"></div>
            <div class="stat-row" id="stat-happy"></div>
            <div class="stat-row" id="stat-food"></div>
            <div class="stat-row" id="stat-timber"></div>
            <div class="stat-row" id="stat-ore"></div>
            <div class="stat-row" id="stat-fish"></div>
          </div>
        </div>

        <!-- Units on island -->
        <div id="units-panel">
          <div class="side-heading">On island</div>
          <div id="units-list"></div>
        </div>

        <!-- World / neighbours -->
        <div id="world-panel">
          <div class="side-heading">🌍 World</div>
          <div id="islands-list"></div>
        </div>

        <!-- Trade -->
        <div id="trade-panel">
          <div class="side-heading">🤝 Trade</div>
          <div id="trade-offers-list"><em>No active offers</em></div>
          <div id="new-trade" class="hidden">
            <div class="trade-form">
              <label>Offer <input type="number" id="offer-amount" min="1" value="10" style="width:48px">
                <select id="offer-resource">
                  <option value="food">🌾</option><option value="ore">⛏️</option>
                  <option value="timber">🪵</option><option value="fish">🐟</option>
                </select>
              </label>
              <label>Want <input type="number" id="want-amount" min="1" value="10" style="width:48px">
                <select id="want-resource">
                  <option value="ore">⛏️</option><option value="food">🌾</option>
                  <option value="timber">🪵</option><option value="fish">🐟</option>
                </select>
              </label>
              <button id="post-trade-btn">Post Offer</button>
            </div>
          </div>
        </div>

        <!-- Chat -->
        <div id="chat-panel">
          <div class="side-heading">💬 Chat</div>
          <div id="chat-log"></div>
          <div class="chat-input-row">
            <input id="chat-input" type="text" placeholder="Say something…" maxlength="200">
            <button id="chat-send-btn">➤</button>
          </div>
        </div>

      </div><!-- /sidebar -->
    </div><!-- /game-body -->

    <!-- Builder tooltip (follows cursor / appears on tap) -->
    <div id="builder-tooltip" class="hidden"></div>

    <div id="toast"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="src/constants.js"></script>
  <script src="src/map.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
